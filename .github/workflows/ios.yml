name: iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  ios:
    name: MAUI iOS (unsigned)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select Xcode 26.6
        run: |
          echo "Installed Xcodes:"; ls -d /Applications/Xcode*.app 2>/dev/null || true
          XC=/Applications/Xcode_26.6.app
          if [ ! -d "$XC" ]; then XC=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | sort -V | tail -1); fi
          if [ ! -d "$XC" ]; then XC=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1); fi
          echo "Using: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          sudo xcodebuild -runFirstLaunch || true
          echo "actool: $(xcrun --find actool 2>&1 || echo MISSING)"
          echo "MacOSX SDKs:"; ls "$XC/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs" 2>&1 || true
          xcodebuild -version || true
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"

      - name: Restore MAUI workloads
        working-directory: maui-client
        run: dotnet workload restore BridgeToFreedom.csproj --ignore-failed-sources

      - name: Build unsigned .app (net10.0-ios, arm64)
        working-directory: maui-client
        run: |
          dotnet build BridgeToFreedom.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:CodesignKey= \
            -p:CodesignProvision= \
            -p:ArchiveOnBuild=false \
            -p:MtouchLink=SdkOnly

      - name: Package unsigned IPA
        working-directory: maui-client
        run: |
          set -e
          APP=$(find bin/Release/net10.0-ios -maxdepth 3 -name '*.app' -type d | head -1)
          echo "Found app bundle: $APP"
          if [ -z "$APP" ]; then echo "No .app produced"; find bin -maxdepth 4 -name '*.app' -o -name '*.dll' | head; exit 1; fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BridgeToFreedom-ios-unsigned.ipa Payload
          ls -la BridgeToFreedom-ios-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: maui-client/BridgeToFreedom-ios-unsigned.ipa
          if-no-files-found: error
